name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests, HTML lint, browser + accessibility check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: HTML lint
        run: npm run lint:html

      # Downloads the Chromium build matching the installed playwright-core version,
      # plus the system libraries it needs.
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Browser check (console errors + axe-core WCAG 2.1 A/AA)
        run: npm run test:browser
