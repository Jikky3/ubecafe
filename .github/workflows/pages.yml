name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: HTML lint
        run: npm run lint:html

      # The site is static: publish only the files the browser needs
      # (never node_modules, tests or tools).
      - name: Stage site
        run: |
          mkdir _site
          cp index.html styles.css _site/
          cp -r js _site/
          for optional in assets icons images manifest.webmanifest sw.js service-worker.js favicon.ico robots.txt; do
            if [ -e "$optional" ]; then cp -r "$optional" _site/; fi
          done
          find _site -type f | sort

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
